services:
  mt5-container:
    build:
      context: .
      dockerfile: mt5/Dockerfile
    privileged: true # Grants full system call access for Wine 11
    environment:
      - VNC_PASSWD=MySafeTradingPassword123!
    volumes:
      # Link the startup script directly so edits on the host apply instantly
      - ./mt5/start_cluster.sh:/root/start_cluster.sh
      # Mount your host scripts folder inside the container
      - /pjt_src/stockai/mt5code:/root/scripts
    ports:
      - "127.0.0.1:58801-58810:58801-58810" # Mapped ports for your 10 custom HTTP Python scripts
      - "127.0.0.1:8080:8080" # Secure noVNC Port
      - "127.0.0.1:5900:5900"
    restart: always
